name: ${COMPOSE_PROJECT_NAME:-message-broker-stack}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"

x-default-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}", "--masterauth", "${REDIS_PASSWORD}"]
    env_file: [.env.prod]
    volumes:
      - ./redis/prod/redis-master.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/prod/redis-master:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net]
    mem_limit: 768m
    cpus: 0.70
    <<: *default-security

  redis-replica:
    image: redis:7.2-alpine
    container_name: redis-replica
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}", "--masterauth", "${REDIS_PASSWORD}"]
    env_file: [.env.prod]
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - ./redis/prod/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/prod/redis-replica:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} INFO replication | grep -E 'role:slave|role:replica'"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net]
    mem_limit: 768m
    cpus: 0.70
    <<: *default-security

  redis-sentinel:
    image: redis:7.2-alpine
    container_name: redis-sentinel
    env_file: [.env.prod]
    command: ["sh", "-c", "envsubst < /etc/redis/sentinel.conf > /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"]
    volumes:
      - ./redis/prod/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_SENTINEL_PORT} SENTINEL get-master-addr-by-name ${REDIS_MASTER_SET} | grep -q redis-master"]
      interval: 15s
      timeout: 6s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net]
    mem_limit: 256m
    cpus: 0.30
    read_only: true
    tmpfs:
      - /tmp
    <<: *default-security

  redis-lb:
    image: haproxy:2.9-alpine
    container_name: redis-lb
    profiles: ["redis-lb"]
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - ./redis/prod/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    expose:
      - "6379"
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net]
    read_only: true
    tmpfs: [/run]
    <<: *default-security

  rabbitmq-1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-1
    container_name: rabbitmq-1
    env_file: [.env.prod]
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
    volumes:
      - ./rabbitmq/prod/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/prod/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/prod/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./data/prod/rabbitmq-1:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
      - "15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 8s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net, monitoring_net]
    mem_limit: 1g
    cpus: 1.00
    <<: *default-security

  rabbitmq-2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-2
    container_name: rabbitmq-2
    env_file: [.env.prod]
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
    volumes:
      - ./rabbitmq/prod/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/prod/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/prod/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./data/prod/rabbitmq-2:/var/lib/rabbitmq
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    command: >
      sh -c "rabbitmq-server -detached &&
             rabbitmqctl stop_app &&
             rabbitmqctl join_cluster rabbit@rabbitmq-1 &&
             rabbitmqctl start_app &&
             tail -f /var/log/rabbitmq/*.log"
    expose: ["5672", "15672", "15692"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 8s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net, monitoring_net]
    mem_limit: 1g
    cpus: 1.00
    <<: *default-security

  rabbitmq-3:
    image: rabbitmq:3.13-management
    hostname: rabbitmq-3
    container_name: rabbitmq-3
    env_file: [.env.prod]
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
    volumes:
      - ./rabbitmq/prod/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/prod/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/prod/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./data/prod/rabbitmq-3:/var/lib/rabbitmq
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    command: >
      sh -c "rabbitmq-server -detached &&
             rabbitmqctl stop_app &&
             rabbitmqctl join_cluster rabbit@rabbitmq-1 &&
             rabbitmqctl start_app &&
             tail -f /var/log/rabbitmq/*.log"
    expose: ["5672", "15672", "15692"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 8s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net, monitoring_net]
    mem_limit: 1g
    cpus: 1.00
    <<: *default-security

  rabbitmq-lb:
    image: haproxy:2.9-alpine
    container_name: rabbitmq-lb
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_started
      rabbitmq-3:
        condition: service_started
    volumes:
      - ./rabbitmq/prod/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5672:5672"
    expose:
      - "15672"
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net]
    read_only: true
    tmpfs: [/run]
    <<: *default-security

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    env_file:
      - .env.prod
      - ./kafka/prod/kafka-broker-1.env
    volumes:
      - ./data/prod/kafka-1:/bitnami/kafka
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [broker_prod_net, monitoring_net]
    mem_limit: 2g
    cpus: 1.50
    <<: *default-security

networks:
  broker_prod_net:
    name: broker_prod_net
    driver: bridge
  monitoring_net:
    name: monitoring_net
    driver: bridge
