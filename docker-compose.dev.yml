name: ${COMPOSE_PROJECT_NAME:-message-broker-stack-dev}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-dev
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env.dev
    volumes:
      - ./redis/dev/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - broker_dev_net

  redisinsight:
    image: redis/redisinsight:2.58
    container_name: redisinsight-dev
    profiles: ["tools"]
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5540 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - broker_dev_net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-dev
    env_file:
      - .env.dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    volumes:
      - ./rabbitmq/dev/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/dev/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/dev/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_dev_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 8s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks:
      - broker_dev_net

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka-dev
    env_file:
      - .env.dev
      - ./kafka/dev/kafka.env
    volumes:
      - kafka_dev_data:/bitnami/kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - broker_dev_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-dev
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: dev-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks:
      - broker_dev_net

volumes:
  redis_dev_data:
  redisinsight_dev_data:
  rabbitmq_dev_data:
  kafka_dev_data:

networks:
  broker_dev_net:
    name: broker_dev_net
    driver: bridge
