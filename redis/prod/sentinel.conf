port ${REDIS_SENTINEL_PORT}
bind 0.0.0.0
protected-mode yes

sentinel monitor ${REDIS_MASTER_SET} redis-master 6379 2
sentinel auth-pass ${REDIS_MASTER_SET} ${REDIS_PASSWORD}

sentinel down-after-milliseconds ${REDIS_MASTER_SET} 10000
sentinel failover-timeout ${REDIS_MASTER_SET} 60000
sentinel parallel-syncs ${REDIS_MASTER_SET} 1
