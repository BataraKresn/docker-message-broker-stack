global
  log stdout format raw local0
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  log global

frontend redis_frontend
  bind *:6379
  default_backend redis_master_backend

backend redis_master_backend
  option tcp-check
  tcp-check connect
  server redis-master redis-master:6379 check inter 2s rise 2 fall 3
